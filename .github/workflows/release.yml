name: Release build

# Builds the release APK from a tag like `v1.0.0` and uploads it as a
# workflow artifact (Actions tab, kept 90 days).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      # No NDK step: Kotlin/Native downloads its own Android sysroot/toolchain.

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias opencode \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass opencode -keystorepass opencode -keypass opencode \
            -dname "CN=OpenCode for Android, OU=OpenCode, O=OpenCode for Android, L=Ho Chi Minh, ST=Ho Chi Minh, C=VN"

      - name: Build release APK
        run: >
          ./gradlew :app:assembleRelease
          -PRELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.jks
          -PRELEASE_STORE_PASSWORD=opencode
          -PRELEASE_KEY_ALIAS=opencode
          -PRELEASE_KEY_PASSWORD=opencode
          --no-daemon --stacktrace

      - name: Stamp APK with tag
        id: apk
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA=$(git rev-parse --short HEAD)
          NAME="OpenCodeForAndroid-${TAG}-${SHA}-release.apk"
          mkdir dist && cp app/build/outputs/apk/release/*.apk "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (Actions tab, kept 90 days)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          retention-days: 90
