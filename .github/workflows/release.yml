name: Release build

# Builds the release APK from a tag like `v1.0.0` and uploads it as a
# workflow artifact (Actions tab, kept 90 days).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/native.yml

  release:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download native helpers
        uses: actions/download-artifact@v7
        with:
          name: native-assets
          path: app/src/main/assets/native

      - name: Download APK native libraries
        uses: actions/download-artifact@v7
        with:
          name: native-libraries
          path: app/src/main/jniLibs

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android NDK and CMake
        run: |
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build release APK
        run: >
          ./gradlew :app:assembleRelease
          -PRELEASE_STORE_FILE=$GITHUB_WORKSPACE/keystore/debug.keystore
          -PRELEASE_STORE_PASSWORD=android
          -PRELEASE_KEY_ALIAS=androiddebugkey
          -PRELEASE_KEY_PASSWORD=android
          --no-daemon --stacktrace

      - name: Stamp APK with tag
        id: apk
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA=$(git rev-parse --short HEAD)
          NAME="OpenCodeForAndroid-${TAG}-${SHA}-release.apk"
          mkdir dist && cp app/build/outputs/apk/release/*.apk "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (Actions tab, kept 90 days)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          retention-days: 90
