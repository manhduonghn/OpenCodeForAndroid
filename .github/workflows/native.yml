name: Native helpers

# Builds and tests the native assets of the app:
#   - liboc-pathmap.so (glibc preload, per ABI),
#   - oc-gopatch and the oc-gosys blob (static Go, per ABI),
#   - opencode-pty (pure C web-terminal daemon, per ABI),
#   - liboc-exec.so (bionic LD_PRELOAD W^X shim, per ABI),
#   - liboc_ld.so (relocated glibc loader for the APK native lib dir, per ABI),
#   - oc-run and the ripgrep cache wrapper (bionic PIE, per ABI).
# The debug and release workflows call this workflow and copy the assets into
# app/src/main/assets/native and the executable APK libraries into
# app/src/main/jniLibs before Gradle packages the APK.

on:
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          # The modules live in subdirectories, not at the repository root.
          cache-dependency-path: |
            native/gopatch/go.mod
            native/test/go.mod

      - name: Install cross compiler and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      - name: Test liboc-pathmap.so
        run: |
          chmod +x native/pathmap/*.sh native/gosys/*.sh native/test/*.sh
          native/pathmap/run-test.sh x86_64
          native/pathmap/run-test.sh aarch64

      - name: Test the APK entry points
        run: bash native/wrappers/run-test.sh

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build the native helpers and the terminal daemon
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          native/gosys/build.sh
          mkdir -p dist/native/arm64-v8a dist/native/x86_64
          native/pty-c/build.sh arm64-v8a dist/native/arm64-v8a/opencode-pty
          native/pty-c/build.sh x86_64 dist/native/x86_64/opencode-pty
          native/pathmap/build.sh aarch64 dist/native/arm64-v8a/liboc-pathmap.so
          native/pathmap/build.sh x86_64 dist/native/x86_64/liboc-pathmap.so
          native/oc-launcher/build.sh arm64-v8a dist/native/arm64-v8a/oc-launcher
          native/oc-launcher/build.sh x86_64 dist/native/x86_64/oc-launcher
          chmod +x native/oc-exec/build.sh native/glibc-loader/build.sh native/wrappers/build.sh
          native/oc-exec/build.sh arm64-v8a dist/native/arm64-v8a/liboc-exec.so
          native/oc-exec/build.sh x86_64 dist/native/x86_64/liboc-exec.so
          native/glibc-loader/build.sh arm64-v8a dist/native/arm64-v8a/liboc_ld.so
          native/glibc-loader/build.sh x86_64 dist/native/x86_64/liboc_ld.so
          native/wrappers/build.sh arm64-v8a \
            dist/native/arm64-v8a/liboc_ocrun.so dist/native/arm64-v8a/liboc_rg.so
          native/wrappers/build.sh x86_64 \
            dist/native/x86_64/liboc_ocrun.so dist/native/x86_64/liboc_rg.so
          (
            cd native/gopatch
            go vet ./...
            go test ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false \
              -ldflags="-s -w" -o "$GITHUB_WORKSPACE/dist/native/arm64-v8a/oc-gopatch" .
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false \
              -ldflags="-s -w" -o "$GITHUB_WORKSPACE/dist/native/x86_64/oc-gopatch" .
          )
          # targetSdk 36 still allows execve() of files in nativeLibraryDir
          # (apk_data_file). Static Go and the server-spawned PTY daemon cannot
          # be routed through Android's linker, so those helpers live there.
          mkdir -p dist/jniLibs/arm64-v8a dist/jniLibs/x86_64
          for abi in arm64-v8a x86_64; do
            cp "dist/native/$abi/liboc-exec.so" "dist/jniLibs/$abi/liboc_exec.so"
            cp "dist/native/$abi/liboc_ld.so" "dist/jniLibs/$abi/liboc_ld.so"
            cp "dist/native/$abi/oc-gopatch" "dist/jniLibs/$abi/liboc_gopatch.so"
            cp "dist/native/$abi/opencode-pty" "dist/jniLibs/$abi/liboc_pty.so"
            cp "dist/native/$abi/liboc_ocrun.so" "dist/jniLibs/$abi/liboc_ocrun.so"
            cp "dist/native/$abi/liboc_rg.so" "dist/jniLibs/$abi/liboc_rg.so"
          done

      - name: End-to-end tests
        run: native/test/run.sh

      - name: Upload native assets
        uses: actions/upload-artifact@v7
        with:
          name: native-assets
          path: dist/native/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK native libraries
        uses: actions/upload-artifact@v7
        with:
          name: native-libraries
          path: dist/jniLibs/**
          if-no-files-found: error
          retention-days: 30
